name: Physical Property Testing
description: >-
  Physical Properties Testers (PPT) Group is a Halifax, UK based multinational
  manufacturer of physical property test and measurement instrumentation, built
  through acquisition around four brands: James Heal (textile testing including
  bursting strength, abrasion and tear), Mecmesin (universal testing machines,
  torque testers and digital force gauges), Alluris (handheld force gauges and
  force/torque instrumentation) and Lansmont (shock, vibration and drop testing
  systems). The group designs, produces and services testing equipment that
  verifies the physical integrity and quality of raw materials, components and
  finished products across textiles, packaging, manufacturing and consumer
  goods. It is a hardware and laboratory-instrumentation business with no public
  developer API, SDK, or webhook surface. Registered in England and Wales
  (company no. 09210539); a portfolio company of SK Capital Partners since
  March 2025 (previously backed by Battery Ventures). This profile was surfaced
  as a VC portfolio lead and enriched with company identity from public sources.
